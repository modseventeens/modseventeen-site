<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>投資系統 — Justin Liao</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#006aff;--ink:#0a0a0a;--muted:#666;--line:#e5e5e5;--soft:#f6f7f9}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang TC","Noto Sans TC",Arial,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* NAV（沿用首頁樣式） */
.nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:rgba(255,255,255,.88);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1120px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px}
.nav-brand{font-weight:700;font-size:18px;letter-spacing:-.02em;text-decoration:none}
.nav-brand span{color:var(--muted);font-weight:500}
.nav-back{font-size:14px;color:var(--muted);text-decoration:none}
.nav-back:hover{color:var(--accent)}

main{max-width:1120px;margin:0 auto;padding:40px 24px 80px}
h1{font-size:32px;letter-spacing:-.03em;font-weight:800;margin-bottom:24px}

/* 頁簽 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:28px;overflow-x:auto}
.tab{padding:12px 18px;font-size:15px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.panel[hidden]{display:none}
.placeholder{padding:64px 24px;text-align:center;color:var(--muted);background:var(--soft);border-radius:16px}

/* 列表 */
.list-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;font-size:14px;color:var(--muted)}
table.notes{width:100%;border-collapse:collapse}
.notes th{font-size:13px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.notes td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
.notes td.date,.notes th.date{width:120px;white-space:nowrap;font-variant-numeric:tabular-nums;color:#333}
.notes td.channel,.notes th.channel{width:200px;color:#333}
.title-btn{text-align:left;font-weight:600;line-height:1.45}
.title-btn:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.state{padding:48px 12px;text-align:center;color:var(--muted)}
.state.error{color:#c62828}

/* 分頁 */
.pager{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:28px;flex-wrap:wrap}
.pager button{min-width:36px;height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);font-size:14px}
.pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pager button[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pager button:disabled{opacity:.35;cursor:default}
.pager .gap{color:var(--muted);padding:0 4px}

/* 彈窗 */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(10,10,10,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.overlay[hidden]{display:none}
.modal{position:relative;width:100%;max-width:880px;background:#fff;border-radius:18px;box-shadow:0 24px 64px rgba(0,0,0,.25);padding:28px 32px 36px}
.modal-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;color:var(--muted)}
.modal-close:hover{background:var(--soft);color:var(--ink)}
.modal h2{font-size:22px;line-height:1.4;letter-spacing:-.02em;padding-right:40px}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--muted);margin:10px 0 18px}
.meta a{color:var(--accent);text-decoration:none}
.video{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-bottom:24px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.section-label{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.04em;margin:8px 0 10px}
.summary{background:#f3f7ff;border:1px solid #d6e5ff;border-radius:12px;padding:16px 20px 16px 36px;margin-bottom:20px}
.summary li{margin:4px 0}
details.fullnote>summary{cursor:pointer;font-weight:600;color:var(--accent);margin:8px 0 14px;list-style:none}
details.fullnote>summary::before{content:"▸ ";}
details.fullnote[open]>summary::before{content:"▾ ";}

/* 筆記內文 */
.note{font-size:15px;line-height:1.75;color:#222}
.note p{margin:10px 0}
.note h3,.note h4,.note h5{margin:22px 0 8px;line-height:1.4}
.note ul,.note ol{padding-left:22px;margin:8px 0}
.note li{margin:4px 0}
.note li>ul,.note li>ol{margin:4px 0}
.note .callout{display:flex;gap:10px;background:var(--soft);border-radius:10px;padding:12px 16px;margin:12px 0}
.note .callout-icon{flex:none}
.note .callout-body{min-width:0}
.note blockquote{border-left:3px solid var(--line);padding-left:14px;color:#444;margin:12px 0}
.note hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.note code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:.9em}
.note pre{background:var(--soft);padding:12px;border-radius:8px;overflow-x:auto}
.note img{max-width:100%;border-radius:8px}
.note .table-wrap{overflow-x:auto;margin:14px 0}
.note table{border-collapse:collapse;font-size:14px;min-width:560px}
.note th,.note td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.note th{background:var(--soft);font-weight:600}
.note a{color:var(--accent);text-decoration:none}
.note a.ts{font-size:12px;white-space:nowrap}
.note a.ts:hover{text-decoration:underline}
.note .c-gray{color:#888}.note .c-brown{color:#8d6e63}.note .c-orange{color:#e8710a}.note .c-yellow{background:#fff3bf}
.note .c-green{color:#2e7d32}.note .c-blue{color:var(--accent)}.note .c-purple{color:#7b1fa2}.note .c-pink{color:#c2185b}.note .c-red{color:#c62828}
.note [class$="_background"]{border-radius:3px;padding:0 2px}
.note .c-yellow_background{background:#fff3bf}.note .c-gray_background{background:#f1f1ef}.note .c-blue_background{background:#e7f0ff}
.note .c-green_background{background:#e6f4ea}.note .c-red_background{background:#fde8e8}.note .c-orange_background{background:#fdebd8}
.note .c-purple_background{background:#f3e8fd}.note .c-pink_background{background:#fde8f1}.note .c-brown_background{background:#f4eeee}
body.lock{overflow:hidden}

/* 公開資訊觀測站 */
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.subtab{padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;color:#333}
.subtab:hover{border-color:var(--accent);color:var(--accent)}
.subtab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 14px;background:var(--soft);border-radius:12px;margin-bottom:12px;font-size:14px}
.toolbar label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.toolbar [hidden]{display:none !important}
.toolbar select,.toolbar input{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.toolbar input[type=search]{width:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:5px 12px;font-size:14px;color:#333}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.daynav{display:inline-flex;align-items:center;gap:4px}
.daynav button{width:28px;height:30px;border:1px solid var(--line);border-radius:8px;background:#fff}
.mops-note{font-size:13px;color:var(--muted);margin:4px 0 10px;display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between}
.mops-note .warn{color:#b26a00}
table.grid{width:100%;border-collapse:collapse;font-size:14px}
.grid th{font-size:13px;font-weight:600;color:var(--muted);text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.grid td.n,.grid th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.grid td.nw{white-space:nowrap}
.grid tr.click{cursor:pointer}
.grid tr.click:hover td{background:#f7faff}
.co b{font-variant-numeric:tabular-nums;margin-right:4px}
.mk{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
.grid .cat{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:#eef4ff;color:#0050c0;white-space:nowrap}
.grid .up{color:#c62828}.grid .down{color:#2e7d32}
.grid .subj{line-height:1.5}
.grid td.memo{white-space:nowrap;font-variant-numeric:tabular-nums;color:#333}
.held{display:inline-block;font-size:11px;font-weight:700;color:#8a5a00;background:#ffe9b0;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}
.grid tr.is-held td{background:#fffaf0}
.grid tr.is-held.click:hover td{background:#fff3d6}
.section-title{font-size:16px;font-weight:700;margin:26px 0 8px}
.section-title small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-bottom:16px}
.detail dt{color:var(--muted)}
.detail .text{white-space:pre-wrap;font-size:15px;line-height:1.8;background:var(--soft);border-radius:12px;padding:16px 18px}
@media (max-width:720px){
  .grid .hide-sm{display:none}
  .toolbar input[type=search]{width:120px}
}

@media (max-width:720px){
  main{padding:28px 16px 64px}
  h1{font-size:26px}
  .notes thead{display:none}
  .notes tr{display:block;padding:14px 0;border-bottom:1px solid var(--line)}
  .notes td{display:inline;border:0;padding:0}
  .notes td.title{display:block;margin-bottom:6px}
  .notes td.date{font-size:13px;color:var(--muted);margin-right:10px}
  .overlay{padding:0}
  .modal{border-radius:0;min-height:100%;padding:20px 16px 32px}
}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a class="nav-brand" href="/">Justin Liao <span>／ 投資系統</span></a>
    <a class="nav-back" href="/">← 回首頁</a>
  </div>
</nav>

<main>
  <h1>投資系統</h1>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-mops" aria-controls="panel-mops" data-tab="mops">公開資訊觀測站</button>
    <button class="tab" role="tab" id="tab-youtube" aria-controls="panel-youtube" data-tab="youtube">YouTube 筆記</button>
    <button class="tab" role="tab" id="tab-reports" aria-controls="panel-reports" data-tab="reports">公司報告</button>
  </div>

  <section class="panel" id="panel-mops" role="tabpanel" aria-labelledby="tab-mops" hidden>
    <div class="subtabs" id="mops-subtabs">
      <button class="subtab" data-sub="material">重大訊息</button>
      <button class="subtab" data-sub="latest">最新公告</button>
      <button class="subtab" data-sub="pretransfer">內部人轉讓申報</button>
      <button class="subtab" data-sub="insiders">內部人持股異動</button>
      <button class="subtab" data-sub="pledges">設質解質</button>
    </div>
    <div class="toolbar" id="mops-toolbar">
      <span class="seg" id="mops-scope">
        <button data-scope="holdings">持股</button><button data-scope="watch">觀察名單</button><button data-scope="all">全部公司</button>
      </span>
      <label>市場 <select id="mops-market"><option value="">全部</option><option value="sii">上市</option><option value="otc">上櫃</option></select></label>
      <label data-for="day">類型 <select id="mops-category"><option value="">全部</option></select></label>
      <span class="daynav" data-for="day"><button id="mops-prev" aria-label="前一天">‹</button><input type="date" id="mops-date"><button id="mops-next" aria-label="後一天">›</button></span>
      <label data-for="month">月份 <input type="month" id="mops-month"></label>
      <label data-for="ym">資料月份 <select id="mops-ym"></select></label>
      <label>搜尋 <input type="search" id="mops-q" placeholder="股號或名稱"></label>
    </div>
    <div class="mops-note" id="mops-note"></div>
    <div id="mops-content"><div class="state">載入中…</div></div>
    <nav class="pager" id="mops-pager" aria-label="分頁"></nav>
  </section>

  <section class="panel" id="panel-youtube" role="tabpanel" aria-labelledby="tab-youtube" hidden>
    <div class="list-head"><span id="count"></span><span id="updated"></span></div>
    <table class="notes">
      <thead><tr><th>標題</th><th class="date">發布日期</th><th class="channel">頻道</th></tr></thead>
      <tbody id="rows"><tr><td colspan="3" class="state">載入中…</td></tr></tbody>
    </table>
    <nav class="pager" id="pager" aria-label="分頁"></nav>
  </section>

  <section class="panel" id="panel-reports" role="tabpanel" aria-labelledby="tab-reports" hidden>
    <div class="placeholder">公司報告資料建置中</div>
  </section>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <button class="modal-close" id="m-close" aria-label="關閉">×</button>
    <h2 id="m-title"></h2>
    <div class="meta" id="m-meta"></div>
    <div class="video" id="m-video"></div>
    <div id="m-body"></div>
  </div>
</div>

<script>
(function () {
  var PAGE_SIZE = 10;
  var DEFAULT_TAB = "mops";
  var API = "/api/youtube-notes";

  var items = [];
  var page = 1;
  var loaded = false;
  var detailCache = {};

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------- 頁簽（網址 #mops / #youtube / #reports） ---------- */
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
  function showTab(hash) {
    var parts = String(hash || "").split("/");
    var name = parts[0];
    if (!document.getElementById("panel-" + name)) name = DEFAULT_TAB;
    tabs.forEach(function (t) {
      var on = t.dataset.tab === name;
      t.setAttribute("aria-selected", on);
      document.getElementById("panel-" + t.dataset.tab).hidden = !on;
    });
    if (name === "youtube" && !loaded) loadList();
    if (name === "mops") mopsShow(parts[1]);
  }
  tabs.forEach(function (t) {
    t.addEventListener("click", function () {
      history.replaceState(null, "", "#" + t.dataset.tab);
      showTab(t.dataset.tab);
    });
  });
  window.addEventListener("hashchange", function () { showTab(decodeURIComponent(location.hash.slice(1))); });

  /* ---------- 列表 ---------- */
  function loadList() {
    loaded = true;
    fetch(API).then(function (r) {
      return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || r.status); return d; });
    }).then(function (d) {
      items = d.items || [];
      page = 1;
      renderList();
    }).catch(function (e) {
      loaded = false;
      $("rows").innerHTML = '<tr><td colspan="3" class="state error">讀取失敗：' + esc(e.message) + '</td></tr>';
    });
  }

  function renderList() {
    var total = items.length;
    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (page > pages) page = pages;
    $("count").textContent = "共 " + total + " 支影片";
    if (!total) {
      $("rows").innerHTML = '<tr><td colspan="3" class="state">目前沒有已完成的筆記</td></tr>';
      $("pager").innerHTML = "";
      return;
    }
    var slice = items.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
    $("rows").innerHTML = slice.map(function (it) {
      return '<tr>' +
        '<td class="title"><button class="title-btn" data-id="' + esc(it.id) + '">' + esc(it.title) + '</button></td>' +
        '<td class="date">' + esc(it.date || "—") + '</td>' +
        '<td class="channel">' + (it.channel ? '<span class="chip">' + esc(it.channel) + '</span>' : "—") + '</td>' +
        '</tr>';
    }).join("");
    renderPager(pages);
  }

  function renderPager(pages) {
    if (pages <= 1) { $("pager").innerHTML = ""; return; }
    var nums = [];
    for (var i = 1; i <= pages; i++) {
      if (i === 1 || i === pages || Math.abs(i - page) <= 1) nums.push(i);
      else if (nums[nums.length - 1] !== "…") nums.push("…");
    }
    var h = '<button data-p="' + (page - 1) + '"' + (page === 1 ? " disabled" : "") + '>上一頁</button>';
    nums.forEach(function (n) {
      h += n === "…" ? '<span class="gap">…</span>'
        : '<button data-p="' + n + '"' + (n === page ? ' aria-current="page"' : "") + '>' + n + '</button>';
    });
    h += '<button data-p="' + (page + 1) + '"' + (page === pages ? " disabled" : "") + '>下一頁</button>';
    $("pager").innerHTML = h;
  }

  $("pager").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-p]");
    if (!b || b.disabled) return;
    page = +b.dataset.p;
    renderList();
    $("panel-youtube").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  $("rows").addEventListener("click", function (e) {
    var b = e.target.closest(".title-btn");
    if (b) openNote(b.dataset.id);
  });

  /* ---------- 彈窗 ---------- */
  var overlay = $("overlay");
  var lastFocus = null;
  var currentId = null;

  function openNote(id) {
    var it = items.filter(function (x) { return x.id === id; })[0] || {};
    lastFocus = document.activeElement;
    currentId = id;
    $("m-title").textContent = it.title || "";
    $("m-meta").innerHTML = meta(it);
    $("m-video").innerHTML = it.videoId
      ? '<iframe id="yt" src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(it.videoId) +
        '?enablejsapi=1&rel=0" title="YouTube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>'
      : "";
    $("m-video").hidden = !it.videoId;
    $("m-body").innerHTML = '<div class="state">筆記載入中…</div>';
    overlay.hidden = false;
    document.body.classList.add("lock");
    overlay.scrollTop = 0;
    $("m-close").focus();

    var p = detailCache[id] || fetch(API + "/" + id).then(function (r) {
      return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || r.status); return d; });
    });
    detailCache[id] = p;
    p.then(function (d) {
      if (currentId !== id) return; // 已關閉或切到別篇
      if (d.length) $("m-meta").innerHTML = meta(Object.assign({}, it, d));
      $("m-body").innerHTML = body(d);
    }).catch(function (e) {
      delete detailCache[id];
      $("m-body").innerHTML = '<div class="state error">筆記讀取失敗：' + esc(e.message) + '</div>';
    });
  }

  function meta(it) {
    var parts = [];
    if (it.date) parts.push("<span>" + esc(it.date) + "</span>");
    if (it.channel) parts.push('<span class="chip">' + esc(it.channel) + '</span>');
    if (it.type) parts.push("<span>" + esc(it.type) + "</span>");
    if (it.length) parts.push("<span>長度 " + esc(it.length) + "</span>");
    if (it.link) parts.push('<a href="' + esc(it.link) + '" target="_blank" rel="noopener">在 YouTube 開啟 ↗</a>');
    return parts.join("");
  }

  function body(d) {
    var note = '<div class="note">' + (d.html || '<p class="state">這篇沒有筆記內容</p>') + '</div>';
    if (!d.summary) return note;
    var lines = d.summary.split(/\n+/).map(function (l) { return l.replace(/^\s*(?:[-•*・]|\d+[.)、])\s*/, "").trim(); })
      .filter(Boolean);
    return '<div class="section-label">重點摘要</div>' +
      '<ul class="summary">' + lines.map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + '</ul>' +
      '<details class="fullnote"><summary>展開完整筆記</summary>' + note + '</details>';
  }

  function closeNote() {
    if (overlay.hidden) return;
    overlay.hidden = true;
    currentId = null;
    $("m-video").innerHTML = ""; // 停止播放
    document.body.classList.remove("lock");
    if (lastFocus) lastFocus.focus();
  }

  // 點彈窗外面（灰色遮罩）關閉
  overlay.addEventListener("mousedown", function (e) { overlay._downOutside = e.target === overlay; });
  overlay.addEventListener("click", function (e) {
    if (e.target === overlay && overlay._downOutside) closeNote();
  });
  $("m-close").addEventListener("click", closeNote);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeNote(); });

  // 筆記裡的時間戳：直接讓上方影片跳到該秒數
  $("m-body").addEventListener("click", function (e) {
    var a = e.target.closest("a.ts");
    var yt = document.getElementById("yt");
    if (!a || !yt) return;
    e.preventDefault();
    var send = function (func, args) {
      yt.contentWindow.postMessage(JSON.stringify({ event: "command", func: func, args: args || [] }), "*");
    };
    send("seekTo", [+a.dataset.t, true]);
    send("playVideo");
    $("m-video").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  /* ======================================================================
     公開資訊觀測站
     ====================================================================== */
  var M_API = "/system/api/mops";
  var M_PAGE = 20;
  var SUBS = {
    material: { label: "重大訊息", filter: "day", job: "realtime" },
    latest: { label: "最新公告", filter: "day", job: "latest" },
    pretransfer: { label: "內部人轉讓申報", filter: "month", job: "pretransfer" },
    insiders: { label: "內部人持股異動", filter: "ym", job: "monthly" },
    pledges: { label: "設質解質", filter: "month", job: "pledges" },
  };
  var MK = { sii: "上市", otc: "上櫃" };
  var ms = { sub: "material", scope: null, market: "", category: "", dates: {}, month: "", ym: "", q: "", page: 1, meta: null, data: null, key: "" };

  function twToday() { return new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10); }
  function getJSON(url) {
    return fetch(url).then(function (r) {
      return r.json().then(function (d) { if (!r.ok) throw new Error(d.detail || d.error || r.status); return d; });
    });
  }
  function lots(n) {
    n = +n || 0;
    return (n / 1000).toLocaleString("zh-TW", { maximumFractionDigits: 3 });
  }
  function co(r) {
    return '<span class="co"><b>' + esc(r.company_id) + '</b>' + esc(r.company_name || "") +
      (r.market ? '<span class="mk">' + (MK[r.market] || esc(r.market)) + '</span>' : "") +
      (r.held ? '<span class="held">持股</span>' : "") + '</span>';
  }
  function fmtTime(iso) {
    if (!iso) return "";
    var d = new Date(new Date(iso).getTime() + 8 * 3600e3).toISOString();
    return d.slice(5, 10).replace("-", "/") + " " + d.slice(11, 16);
  }

  function mopsShow(sub) {
    if (sub && SUBS[sub]) ms.sub = sub;
    if (!ms.meta) {
      $("mops-content").innerHTML = '<div class="state">載入中…</div>';
      getJSON(M_API + "/meta").then(function (m) {
        ms.meta = m;
        if (!ms.scope) ms.scope = m.watchCount > 0 ? "watch" : "all";
        ms.month = twToday().slice(0, 7);
        $("mops-month").value = ms.month;
        $("mops-ym").innerHTML = (m.insiderMonths || []).map(function (y) { return '<option value="' + y + '">' + y + '</option>'; }).join("") || '<option value="">尚無資料</option>';
        ms.ym = (m.insiderMonths || [])[0] || "";
        mopsShow();
      }).catch(function (e) {
        $("mops-content").innerHTML = '<div class="state error">讀取失敗：' + esc(e.message) + '</div>';
      });
      return;
    }
    [].forEach.call(document.querySelectorAll("#mops-subtabs .subtab"), function (b) { b.setAttribute("aria-pressed", b.dataset.sub === ms.sub); });
    [].forEach.call(document.querySelectorAll("#mops-scope button"), function (b) {
      b.setAttribute("aria-pressed", b.dataset.scope === ms.scope);
      if (b.dataset.scope === "watch") b.textContent = "觀察名單（" + ms.meta.watchCount + "）";
      if (b.dataset.scope === "holdings") b.textContent = "持股（" + (ms.meta.holdingsCount || 0) + "）";
    });
    var f = SUBS[ms.sub].filter;
    if (f === "day") $("mops-date").value = ms.dates[ms.sub] || "";
    [].forEach.call(document.querySelectorAll("#mops-toolbar [data-for]"), function (el) { el.hidden = el.dataset.for !== f; });
    mopsLoad();
  }

  function mopsUrl() {
    var p = new URLSearchParams({ scope: ms.scope });
    if (ms.q) p.set("q", ms.q);
    var s = ms.sub;
    if (s === "material" || s === "latest") { p.set("kind", s); if (ms.dates[s]) p.set("date", ms.dates[s]); return M_API + "/announcements?" + p; }
    if (s === "pretransfer") { p.set("month", ms.month); return M_API + "/pretransfers?" + p; }
    if (s === "pledges") { p.set("month", ms.month); return M_API + "/pledges?" + p; }
    if (ms.ym) p.set("ym", ms.ym);
    return M_API + "/insiders?" + p;
  }

  function mopsLoad() {
    var url = mopsUrl();
    if (url === ms.key && ms.data) { mopsRender(); return; }
    ms.key = url;
    $("mops-content").innerHTML = '<div class="state">載入中…</div>';
    $("mops-pager").innerHTML = "";
    getJSON(url).then(function (d) {
      if (url !== ms.key) return;
      ms.data = d;
      if ((ms.sub === "material" || ms.sub === "latest") && d.date && !ms.q) { ms.dates[ms.sub] = d.date; $("mops-date").value = d.date; }
      if (ms.sub === "insiders" && d.ym) { ms.ym = d.ym; $("mops-ym").value = d.ym; }
      mopsRender();
    }).catch(function (e) {
      if (url !== ms.key) return;
      ms.key = "";
      $("mops-content").innerHTML = '<div class="state error">讀取失敗：' + esc(e.message) + '</div>';
    });
  }

  function byMarket(list) { return ms.market ? list.filter(function (r) { return r.market === ms.market; }) : list; }

  function mopsNote(extra) {
    var m = ms.meta, job = m.updated && m.updated[SUBS[ms.sub].job];
    var scopeText = { holdings: "持股 " + (m.holdingsCount || 0) + " 家", watch: "觀察名單 " + m.watchCount + " 家", all: "全部公司（上市＋上櫃）" }[ms.scope];
    var left = scopeText + (extra ? "｜" + extra : "");
    if (ms.scope === "watch" && !m.watchCount) left = '<span class="warn">觀察名單還是空的，請先在 Google Sheet 加入股號</span>';
    if (ms.scope === "holdings" && !m.holdingsCount) left = '<span class="warn">持股名單還沒讀到，請確認 Google Sheet「持股」分頁有發佈</span>';
    var right = job ? (job.ok ? "最後更新 " + fmtTime(job.at) : '<span class="warn">上次更新失敗（' + fmtTime(job.at) + '）：' + esc(job.error || "") + '</span>') : "尚未更新";
    $("mops-note").innerHTML = "<span>" + left + "</span><span>" + right + "</span>";
  }

  function slicePage(list) {
    var pages = Math.max(1, Math.ceil(list.length / M_PAGE));
    if (ms.page > pages) ms.page = pages;
    mopsPager(pages);
    return list.slice((ms.page - 1) * M_PAGE, ms.page * M_PAGE);
  }
  function mopsPager(pages) {
    if (pages <= 1) { $("mops-pager").innerHTML = ""; return; }
    var p = ms.page, nums = [];
    for (var i = 1; i <= pages; i++) {
      if (i === 1 || i === pages || Math.abs(i - p) <= 1) nums.push(i);
      else if (nums[nums.length - 1] !== "…") nums.push("…");
    }
    var h = '<button data-p="' + (p - 1) + '"' + (p === 1 ? " disabled" : "") + '>上一頁</button>';
    nums.forEach(function (n) {
      h += n === "…" ? '<span class="gap">…</span>' : '<button data-p="' + n + '"' + (n === p ? ' aria-current="page"' : "") + '>' + n + '</button>';
    });
    h += '<button data-p="' + (p + 1) + '"' + (p === pages ? " disabled" : "") + '>下一頁</button>';
    $("mops-pager").innerHTML = h;
  }
  function tr(r) { return r.held ? '<tr class="is-held">' : "<tr>"; }
  function table(head, rows, empty) {
    if (!rows.length) return '<div class="state">' + (empty || "沒有資料") + '</div>';
    return '<table class="grid"><thead><tr>' + head + '</tr></thead><tbody>' + rows.join("") + '</tbody></table>';
  }

  function mopsRender() {
    var d = ms.data, s = ms.sub, html = "";
    if (s === "material" || s === "latest") {
      var all = byMarket(d.items || []);
      // 類型選單：依目前資料統計
      var counts = {};
      all.forEach(function (r) { counts[r.category] = (counts[r.category] || 0) + 1; });
      var cats = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
      if (ms.category && !counts[ms.category]) ms.category = "";
      $("mops-category").innerHTML = '<option value="">全部（' + all.length + '）</option>' +
        cats.map(function (c) { return '<option value="' + esc(c) + '"' + (c === ms.category ? " selected" : "") + '>' + esc(c) + '（' + counts[c] + '）</option>'; }).join("");
      var list = ms.category ? all.filter(function (r) { return r.category === ms.category; }) : all;
      mopsNote(ms.q ? "搜尋「" + esc(ms.q) + "」，近 180 天" : (d.date ? "資料日期 " + d.date : "") + "｜共 " + list.length + " 則");
      var showDate = !!ms.q;
      var showMemo = s === "material";
      html = table(
        (showDate ? "<th>日期</th>" : "") + "<th>時間</th><th>公司</th><th class=\"hide-sm\">類型</th><th>主旨</th>" +
          (showMemo ? '<th class="hide-sm">備註</th>' : ""),
        slicePage(list).map(function (r) {
          return '<tr class="click' + (r.held ? " is-held" : "") + '" data-rid="' + r.rid + '" data-url="' + esc(r.url || "") + '">' +
            (showDate ? '<td class="nw">' + esc(r.date) + "</td>" : "") +
            '<td class="nw">' + esc(String(r.time || "").slice(0, 5)) + '</td><td class="nw">' + co(r) + '</td>' +
            '<td class="hide-sm"><span class="cat">' + esc(r.category) + '</span></td><td class="subj">' + esc(r.subject) + '</td>' +
            (showMemo ? '<td class="memo hide-sm">' + esc(r.note || "") + '</td>' : "") + '</tr>';
        }),
        ms.q ? "找不到這家公司的資料" : "這一天沒有資料"
      );
    } else if (s === "pretransfer") {
      var pt = byMarket(d.items || []);
      mopsNote(ms.month + " 申報｜共 " + pt.length + " 筆｜事前申報是「預定」轉讓，不代表已經賣出");
      html = table('<th>申報日</th><th>公司</th><th>身分</th><th>姓名</th><th>方式</th><th class="n">預定轉讓（張）</th><th class="n hide-sm">轉讓後持股（張）</th><th class="hide-sm">有效期間</th>',
        slicePage(pt).map(function (r) {
          return tr(r) + '<td class="nw">' + esc(r.report_date) + '</td><td class="nw">' + co(r) + '</td><td>' + esc(r.role) + '</td><td>' + esc(r.holder) +
            '</td><td>' + esc(r.method) + (r.transferee ? '<br><small style="color:var(--muted)">' + esc(r.transferee) + '</small>' : "") + '</td><td class="n">' + lots(r.shares) +
            '</td><td class="n hide-sm">' + lots(r.after) + '</td><td class="nw hide-sm">' + esc(r.period) + '</td></tr>';
        }), "這個月沒有申報");
    } else if (s === "pledges") {
      var ev = byMarket(d.items || []);
      var rt = byMarket((d.ratio && d.ratio.items) || []);
      mopsNote(ms.month + " 申報｜設質解質 " + ev.length + " 筆");
      html = '<div class="section-title">設質解質逐筆<small>內部人每次設定或解除質押的公告</small></div>' +
        table('<th>申報日</th><th>公司</th><th>身分</th><th>姓名</th><th class="n">設質（張）</th><th class="n">解質（張）</th><th class="n hide-sm">累積設質（張）</th><th class="hide-sm">質權人</th>',
          slicePage(ev).map(function (r) {
            return tr(r) + '<td class="nw">' + esc(r.report_date) + '</td><td class="nw">' + co(r) + '</td><td>' + esc(r.role) + '</td><td>' + esc(r.holder) +
              '</td><td class="n up">' + (r.pledged ? lots(r.pledged) : "") + '</td><td class="n down">' + (r.released ? lots(r.released) : "") +
              '</td><td class="n hide-sm">' + lots(r.accumulated) + '</td><td class="hide-sm">' + esc(r.pledgee) + '</td></tr>';
          }), "這個月沒有設質解質公告") +
        '<div class="section-title">董監質押比例' + (d.ratio && d.ratio.ym ? '<small>' + d.ratio.ym + ' 月報' + (ms.scope === "all" && !ms.q ? "，只列 50% 以上" : "") + '</small>' : "") + '</div>' +
        table('<th>公司</th><th class="n">設質股數占董監持股</th>', rt.map(function (r) {
          return tr(r) + '<td class="nw">' + co(r) + '</td><td class="n' + (r.ratio >= 50 ? " up" : "") + '">' + r.ratio.toFixed(2) + '%</td></tr>';
        }), "沒有董監設質的公司");
    } else {
      var ch = byMarket(d.changes || []);
      var lg = byMarket(d.large || []);
      var acq = lg.filter(function (r) { return r.direction === "acquire"; });
      var tra = lg.filter(function (r) { return r.direction === "transfer"; });
      mopsNote(d.ym ? d.ym + " 月報（次月 15–20 日公布）" : "月報尚未抓到");
      var largeRow = function (r) {
        return tr(r) + '<td class="nw">' + co(r) + '</td><td>' + esc(r.role) + '</td><td>' + esc(r.holder) + '</td><td class="n">' + lots(r.shares) + '</td></tr>';
      };
      var lhead = '<th>公司</th><th>身分</th><th>姓名</th><th class="n">股數（張）</th>';
      html = '<div class="section-title">大額取得<small>單人取得 100 萬股以上</small></div>' + table(lhead, acq.map(largeRow), "沒有") +
        '<div class="section-title">大額轉讓<small>單人轉讓 100 萬股以上</small></div>' + table(lhead, tra.map(largeRow), "沒有") +
        '<div class="section-title">董監持股增減<small>依淨增加排序，共 ' + ch.length + ' 家</small></div>' +
        table('<th>公司</th><th class="n">董監增加（張）</th><th class="n">董監減少（張）</th><th class="n">董監持股比例</th><th class="n hide-sm">經理人持股（張）</th>',
          slicePage(ch).map(function (r) {
            return tr(r) + '<td class="nw">' + co(r) + '</td><td class="n up">' + (r.ds_increase ? lots(r.ds_increase) : "") + '</td><td class="n down">' +
              (r.ds_decrease ? lots(r.ds_decrease) : "") + '</td><td class="n">' + (+r.ds_pct).toFixed(2) + '%</td><td class="n hide-sm">' + lots(r.mgr_holding) + '</td></tr>';
          }), "這個月沒有董監持股變動");
    }
    $("mops-content").innerHTML = html;
  }

  function openMopsDetail(rid) {
    lastFocus = document.activeElement;
    currentId = "mops:" + rid;
    var myId = currentId;
    $("m-title").textContent = "載入中…";
    $("m-meta").innerHTML = "";
    $("m-video").innerHTML = "";
    $("m-video").hidden = true;
    $("m-body").innerHTML = '<div class="state">讀取內文…（名單外的公司第一次打開要幾秒）</div>';
    overlay.hidden = false;
    document.body.classList.add("lock");
    overlay.scrollTop = 0;
    $("m-close").focus();
    getJSON(M_API + "/announcements/" + rid).then(function (r) {
      if (currentId !== myId) return;
      $("m-title").textContent = r.subject;
      $("m-meta").innerHTML = "<span>" + esc(r.date) + " " + esc(String(r.time || "").slice(0, 5)) + "</span>" + co(r) +
        '<span class="chip">' + esc(r.category) + '</span>';
      var dl = [];
      if (r.note) dl.push("<dt>備註</dt><dd><strong>" + esc(r.note) + "</strong></dd>");
      if (r.speaker) dl.push("<dt>發言人</dt><dd>" + esc(r.speaker) + "</dd>");
      if (r.clause) dl.push("<dt>符合條款</dt><dd>第 " + esc(r.clause) + " 款</dd>");
      if (r.fact_date) dl.push("<dt>事實發生日</dt><dd>" + esc(r.fact_date) + "</dd>");
      $("m-body").innerHTML = '<div class="detail">' + (dl.length ? "<dl>" + dl.join("") + "</dl>" : "") +
        '<div class="text">' + esc(r.detail || "（沒有說明內容）") + '</div></div>';
    }).catch(function (e) {
      if (currentId !== myId) return;
      $("m-title").textContent = "讀取失敗";
      $("m-body").innerHTML = '<div class="state error">' + esc(e.message) + '</div>';
    });
  }

  /* ---------- 觀測站：事件 ---------- */
  $("mops-subtabs").addEventListener("click", function (e) {
    var b = e.target.closest(".subtab");
    if (!b) return;
    ms.page = 1; ms.category = "";
    history.replaceState(null, "", "#mops/" + b.dataset.sub);
    mopsShow(b.dataset.sub);
  });
  $("mops-scope").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-scope]");
    if (!b || b.dataset.scope === ms.scope) return;
    ms.scope = b.dataset.scope; ms.page = 1;
    mopsShow();
  });
  $("mops-market").addEventListener("change", function () { ms.market = this.value; ms.page = 1; ms.data && mopsRender(); });
  $("mops-category").addEventListener("change", function () { ms.category = this.value; ms.page = 1; mopsRender(); });
  $("mops-date").addEventListener("change", function () { ms.dates[ms.sub] = this.value; ms.page = 1; mopsLoad(); });
  $("mops-month").addEventListener("change", function () { if (this.value) { ms.month = this.value; ms.page = 1; mopsLoad(); } });
  $("mops-ym").addEventListener("change", function () { ms.ym = this.value; ms.page = 1; mopsLoad(); });
  function shiftDay(n) {
    var d = new Date((ms.dates[ms.sub] || twToday()) + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + n);
    ms.dates[ms.sub] = d.toISOString().slice(0, 10); ms.page = 1;
    $("mops-date").value = ms.dates[ms.sub];
    mopsLoad();
  }
  $("mops-prev").addEventListener("click", function () { shiftDay(-1); });
  $("mops-next").addEventListener("click", function () { shiftDay(1); });
  $("mops-q").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    ms.q = this.value.trim(); ms.page = 1;
    mopsLoad();
  });
  $("mops-q").addEventListener("search", function () { if (!this.value && ms.q) { ms.q = ""; ms.page = 1; mopsLoad(); } });
  $("mops-pager").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-p]");
    if (!b || b.disabled) return;
    ms.page = +b.dataset.p;
    mopsRender();
    $("panel-mops").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("mops-content").addEventListener("click", function (e) {
    var tr = e.target.closest("tr.click");
    if (!tr) return;
    if (ms.sub === "material") openMopsDetail(tr.dataset.rid);
    else if (tr.dataset.url) window.open(tr.dataset.url, "_blank", "noopener");
  });

  showTab(decodeURIComponent(location.hash.slice(1)) || DEFAULT_TAB);
})();
</script>
</body>
</html>
